name: Günlük Instagram Post

# Türkiye saatiyle 08:00-23:00 arasında saatte bir paylaşım yapar. main.py günün kalan
# paylaşımlarını (günde en fazla 24 post, her birine story) kalan saatlere böler. GitHub'ın kendi zamanlayıcısı
# bu repoda güvenilmez olduğu için her çalıştırma sonunda next_run.py bir sonraki saate
# kadar bekleyip workflow'u yeniden tetikler (zincir). Aşağıdaki schedule sadece zincir
# koparsa yeniden başlatmak için yedek. Her çalıştırmanın özeti günlük bir issue'ya
# yorum olarak yazılır (e-posta bildirimi).

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç post atılsın? Boş bırakılırsa otomatik"
        required: false
        default: ""
  schedule:
    - cron: "23 5 * * *"   # 08:23 TR — yedek
    - cron: "23 11 * * *"  # 14:23 TR — yedek

permissions:
  contents: write  # görselleri, posted.json ve docs/ commit'lemek için
  issues: write    # paylaşım raporu (e-posta bildirimi)
  actions: write   # zinciri sürdürmek için workflow'u yeniden tetiklemek

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Git kimliği
        run: |
          git config user.name "firsatcokiyi-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Amazon paylaşımları
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ inputs.count }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Sonraki çalıştırmayı planla
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python next_run.py
